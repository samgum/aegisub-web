name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # @huggingface/transformers pulls onnxruntime-node, whose install downloads a large GPU
  # binary from nuget.org. Aegisub Web is browser-only and never loads the Node binding, so the
  # download is 210 MB of nothing, and a slow nuget.org is a failed run with nothing wrong.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # npm ci reaches the registry and fixed GitHub source archives. Retry transient network
      # failures before treating them as a code failure.
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  # What Aegisub Web WRITES, judged by tools that share no code with it. Its own tests can only
  # prove it reads back what it wrote; these prove a subtitle file it produces is one the
  # rest of the world understands.
  oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libxml2-utils
      # pysubs2 is the second reader, in another language, sharing no code with this one.
      # Installed where scripts/oracles.mjs expects to find it.
      - run: python3 -m venv .cache/py && .cache/py/bin/pip install --quiet pysubs2
      # The corpus is committed, so this is not how the fixtures get built: it rebuilds them
      # and re-validates every one against ffmpeg and pysubs2, which catches a fixture whose
      # meaning has drifted from what the outside world reads it as. The rebuilt files are not
      # compared byte for byte with the committed ones on purpose, because ffmpeg stamps its
      # own version into the ASS and LRC it writes and every ffmpeg release would "fail".
      - run: npm run corpus
      - run: npm run check:writers
      - run: npm run check:xml
      # And what it muxes: ffprobe on the containers, and the cues pulled back out of the
      # one subtitle track ffmpeg can read.
      - run: npm run check:mux

  # The editor itself, in a real browser. Everything above runs in node against strings, and
  # editor.ts is both the largest file here and the one nothing else can reach: it only ever
  # touches the DOM. Its own job because it builds the demo and drives Chrome.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - run: npm run test:e2e

  platforms:
    name: ${{ matrix.project }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            project: windows-chromium
            install: chromium
          - os: ubuntu-latest
            project: linux-firefox
            install: --with-deps firefox
          - os: macos-latest
            project: macos-webkit
            install: webkit
          - os: ubuntu-latest
            project: android-chromium
            install: --with-deps chromium
          - os: macos-latest
            project: ipad-webkit
            install: webkit
          - os: macos-latest
            project: iphone-webkit
            install: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: npm ci
      - run: npx playwright install ${{ matrix.install }}
      - name: Start virtual audio output for Firefox media tests
        if: matrix.project == 'linux-firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=playwright sink_properties=device.description=Playwright
          pactl set-default-sink playwright
      - run: npm run build:demo
      - run: npx playwright test --project=${{ matrix.project }}
